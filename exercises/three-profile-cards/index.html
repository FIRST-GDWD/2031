<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Three Cards Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="single-column">

            <!-- Flexbox Container -->
            <div id="card-container">

                <!-- Flexbox Item -->
                <div class="card">
                    <h3>Verso</h3>
                    <img src="images/verso.webp" alt="verso">
                    <p>
                        "You've lived more than a lifetime...it's time 
                        to let her go."
                    </p>
                    <a href="#">View Profile</a>
                </div>

                <!-- Flexbox Item -->
                <div class="card">
                    <h3>Maelle</h3>
                    <img src="images/maelle.png" alt="maelle">
                    <p>
                        "Tomorrow comes!"
                    </p>    
                    <a href="#">View Profile</a>
                </div>

                <!-- Flexbox Item -->
                <div class="card">
                    <h3>Monoco</h3>
                    <img src="images/monoco.png" alt="monoco">
                    <p>
                        "Owowowowow"
                    </p>
                    <a href="#">View Profile</a>
                </div>

            </div>
        </div>
    </body>
</html>
