<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="css/style.css" rel="stylesheet">
        <link 
            rel="stylesheet" 
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" 
            integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer"
        >
    </head>
    <body>
        <!-- <h1>
            Design a two cards layout with flexbox (with the cards side by side)
            aimed at sending well wishes to someone, themed around the recent
            Chinese New Year (welcoming the Year of the Horse).
        </h1> -->
        <div id="single-column">
            <div id="cards-container">
                <div class="card first">
                    <div class="inner-border">
                        <div class="inner-border">
                            <div class="inner-border inner-flex">
                                <div class="horse">
                                    <i class="fa-solid fa-horse"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="inner-border">
                        <div class="inner-border">
                            <div class="inner-border inner-flex-2">
                                <h2>Happy New Year!</h2>
                                <p>
                                    May your year be filled with fortune!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
