<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="color-palette">
            <h2>Misty Ocean</h2>
            <h4 class="color" id="color-1">#CEE5F2</h4>
            <h4 class="color" id="color-2">#ACCBE1</h4>
            <h4 class="color" id="color-3">#7C98B3</h4>
        </div>
        <div class="color-palette">
            <h2>Tropical Sunset</h2>
            <h4 class="color" id="color-8">#F7996E</h4>
            <h4 class="color" id="color-7">#976391</h4>
            <h4 class="color" id="color-6">#712F79</h4>
            <h4 class="color" id="color-5">#4C4C9D</h4>
            <h4 class="color" id="color-4">#48639C</h4>
        </div>
    </body>
</html>
