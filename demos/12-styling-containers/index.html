<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Styling Containers Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <p id="colored-text">
            This text is going to be my color.
        </p>
        <div class="shadowed">
            <p>This one has a little text</p>
            <p>
                Lorem ipsum dolor sit amet consectetur 
                adipisicing elit. Atque neque 
                exercitationem possimus sint provident. 
            </p>
        </div>

        <div class="shadowed">
            <h2>This is a section heading</h2>
            <h4>This is a subsection heading</h4>
        </div>

    </body>
</html>
